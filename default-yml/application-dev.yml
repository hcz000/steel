steel:
  redis:
    cluster: true

# Spring 相关
spring:
  cache:
    type: redis
  redis:
    password: gv123
    cluster:
      nodes:
        - steel.redis.server1:7001
        - steel.redis.server1:7002
        - steel.redis.server1:7003
        - steel.redis.server2:7004
        - steel.redis.server2:7005
        - steel.redis.server2:7006
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_HOST}:5003

  nacos:
    discovery:
      metadata:
        management:
          context-path: /actuator

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS


# feign 配置
feign:
  sentinel:
    enabled: false
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 10000
  compression:
    request:
      enabled: true
    response:
      enabled: true

# swagger 配置
swagger:
  enabled: true
  title: Swagger API
  gateway: http://${GATEWAY_HOST:steel.gateway.server1}:${GATEWAY-PORT:9999}
  token-url: ${swagger.gateway}/auth/oauth2/token
  scope: server
  services:
    ## 用户模块
    user-system-biz: user-api
    ## auth认证模块
    steel-auth: auth
